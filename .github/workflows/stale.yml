name: Stale

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/stale@v10
      with:
        stale-issue-message: 'This issue has been stale for 30 days. It will be closed in 7 days if no further activity occurs.'
        stale-pr-message: 'This PR has been stale for 14 days. It will be closed in 7 days if no further activity occurs.'
        close-issue-message: 'This issue has been closed due to inactivity.'
        close-pr-message: 'This PR has been closed due to inactivity.'
        days-before-issue-stale: 30
        days-before-pr-stale: 14
        days-before-issue-close: 7
        days-before-pr-close: 7
        exempt-issue-labels: 'bug,enhancement,documentation'
        exempt-pr-labels: 'bug,enhancement,documentation'
        stale-issue-label: 'stale'
        stale-pr-label: 'stale'
        close-issue-label: 'closed-by-stale'
        close-pr-label: 'closed-by-stale'
