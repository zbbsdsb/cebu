name: PR Assignment

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Assign PR
      uses: kentaro-m/auto-assign-action@v2.0.0
      with:
        configuration-path: '.github/auto-assign.yml'
