name: 📚 Documentation
description: Report a problem with or suggest improvements to documentation
title: "[Docs] "
labels: ["documentation", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve our documentation!

  - type: dropdown
    id: type
    attributes:
      label: Documentation Type
      description: What type of documentation issue is this?
      options:
        - Missing documentation
        - Outdated documentation
        - Incorrect documentation
        - Unclear documentation
        - Typo or grammar error
        - Suggestion for improvement
        - Other
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Location
      description: Where is the documentation issue? (e.g., README.md, docs/getting_started.md, specific API page)
      placeholder: "README.md"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the documentation issue or suggestion.
    validations:
      required: true

  - type: textarea
    id: suggested
    attributes:
      label: Suggested Change (optional)
      description: If you have a suggestion for how to fix or improve it, please share!

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Is there anything else we should know?
