name: ❓ Question
description: Ask a question about using Cebu
title: "[Question] "
labels: ["question", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for asking a question! Before submitting, please check our documentation to see if it answers your question.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please check the following before submitting a question.
      options:
        - label: I have searched the existing issues for similar questions
          required: true
        - label: I have read the documentation (README, docs/)
          required: true

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to accomplish? Provide some context for your question.
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code Example (optional)
      description: If relevant, provide a code example of what you're trying to do.
      render: cpp

  - type: input
    id: version
    attributes:
      label: Cebu Version
      description: What version of Cebu are you using?
      placeholder: "0.8.0"
    validations:
      required: true
